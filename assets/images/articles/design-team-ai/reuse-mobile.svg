<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1192" viewBox="0 0 640 1192" role="img" aria-labelledby="title desc">
<title id="title">设计决定如何被后续成员复用</title>
<desc id="desc">一份示意的设计决定记录，包含决定、理由、适用范围、版本和维护角色。后续成员查阅记录，判断当前任务是否适用：条件一致时沿用依据，条件变化时重新确认。示例不代表实际项目结果。</desc>
<rect width="640" height="1192" fill="#17191C"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-kerning="normal">
<text x="40" y="78" font-size="40" fill="#F4F3EF" font-weight="500" text-anchor="start">设计决定如何</text>
<text x="40" y="136" font-size="40" fill="#F4F3EF" font-weight="500" text-anchor="start">被后续成员复用</text>
<text x="40" y="190" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">保留依据，先判断是否适用</text>
<path d="M40 226 H600" fill="none" stroke="#44464A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="282" font-size="32" fill="#F4F3EF" font-weight="500" text-anchor="start">设计决定记录</text>
<text x="600" y="282" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="end">示意</text>
<path d="M40 308 H600" fill="none" stroke="#44464A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="364" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">决定</text>
<text x="160" y="364" font-size="28" fill="#F4F3EF" font-weight="400" text-anchor="start">异常申请单独复核</text>
<path d="M40 392 H600" fill="none" stroke="#44464A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="448" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">理由</text>
<text x="160" y="448" font-size="28" fill="#F4F3EF" font-weight="400" text-anchor="start">需要逐项核对补充材料</text>
<path d="M40 476 H600" fill="none" stroke="#44464A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="532" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">适用</text>
<text x="160" y="532" font-size="28" fill="#F4F3EF" font-weight="400" text-anchor="start">存在异常的申请</text>
<path d="M40 560 H600" fill="none" stroke="#44464A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="616" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">版本</text>
<text x="160" y="616" font-size="28" fill="#F4F3EF" font-weight="400" text-anchor="start">已确认版本</text>
<text x="40" y="672" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">维护</text>
<text x="160" y="672" font-size="28" fill="#F4F3EF" font-weight="400" text-anchor="start">产品与设计</text>
<path d="M40 716 H600" fill="none" stroke="#44464A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="774" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="start">后续成员 · 新任务</text>
<text x="320" y="838" font-size="32" fill="#F4F3EF" font-weight="500" text-anchor="middle">查阅记录</text>
<path d="M320 864 L320 902" fill="none" stroke="#B4B5B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M315 895 L320 902 L325 895" fill="none" stroke="#B4B5B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="946" font-size="32" fill="#F4F3EF" font-weight="500" text-anchor="middle">判断当前任务是否适用</text>
<path d="M320 974 V1000 M180 1000 H460" fill="none" stroke="#B4B5B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180 1000 L180 1028" fill="none" stroke="#B4B5B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M175 1021 L180 1028 L185 1021" fill="none" stroke="#B4B5B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M460 1000 L460 1028" fill="none" stroke="#FA8C5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M455 1021 L460 1028 L465 1021" fill="none" stroke="#FA8C5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="1070" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="middle">条件一致</text>
<text x="460" y="1070" font-size="28" fill="#B4B5B7" font-weight="400" text-anchor="middle">条件变化</text>
<text x="180" y="1120" font-size="32" fill="#F4F3EF" font-weight="500" text-anchor="middle">沿用依据</text>
<text x="460" y="1120" font-size="32" fill="#FA8C5C" font-weight="500" text-anchor="middle">重新确认</text>
</g>
</svg>