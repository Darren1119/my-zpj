<text x="900" y="226" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="236">Human judgment</text>
<text x="64" y="330" fill="#F4F3EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start" data-fit-width="290">Requirements</text>
<text x="64" y="368" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="290">PRD and business rules</text>
