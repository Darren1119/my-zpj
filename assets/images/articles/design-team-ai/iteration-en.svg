<text x="64" y="538" fill="#F4F3EF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start" data-fit-width="290">Approved decisions</text>
<text x="64" y="576" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="290">Context and rationale</text>
