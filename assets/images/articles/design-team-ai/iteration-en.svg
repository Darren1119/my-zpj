<text x="924" y="335" fill="#F4F3EF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="start" data-fit-width="188"><tspan x="924" y="335.0">Resolve key </tspan><tspan x="924" y="364.9">questions</tspan></text>
