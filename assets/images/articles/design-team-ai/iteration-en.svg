<rect x="900" y="504" width="236" height="112" rx="3" fill="#17191C" stroke="#44464A" stroke-width="1"/>
<text x="924" y="549" fill="#F4F3EF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="start" data-fit-width="188">Delivery review</text>
<text x="924" y="586" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" data-fit-width="188">Approve final results</text>
<path d="M64 678 H1136" fill="none" stroke="#44464A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="714" fill="#FA8C5C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="500">Key questions</text>
<text x="64" y="754" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="550">Check evidence; ask if still unclear</text>
<text x="704" y="714" fill="#F4F3EF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="360">Stay in control</text>
<text x="704" y="754" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="432">Scoped changes · Version history</text>
</svg>