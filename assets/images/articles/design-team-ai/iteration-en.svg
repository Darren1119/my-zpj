<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="harness-title harness-desc">
<title id="harness-title">Project context in every revision</title>
<desc id="harness-desc">Project requirements, applicable standards and confirmed decisions inform generation, revision and checks. Findings guide further changes; unresolved key questions go to a person before final delivery review.</desc>
<rect width="1200" height="800" fill="#17191C"/>
<defs>
<marker id="harness-muted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#B4B5B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="harness-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#FA8C5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="64" y="88" fill="#F4F3EF" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="500" text-anchor="start" data-fit-width="1072">Project context in every revision</text>
<text x="64" y="132" fill="#B4B5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-fit-width="1072">Harness connects context, tools and checks</text>
